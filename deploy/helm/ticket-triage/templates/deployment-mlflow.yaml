apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ticket-triage.fullname" . }}-mlflow
  labels:
    {{- include "ticket-triage.labels" . | nindent 4 }}
    app.kubernetes.io/component: mlflow
spec:
  replicas: {{ .Values.mlflow.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ticket-triage.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ticket-triage.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: mlflow
    spec:
      containers:
        - name: mlflow
          image: "{{ .Values.mlflow.image.repository }}:{{ .Values.mlflow.image.tag }}"
          imagePullPolicy: {{ .Values.mlflow.image.pullPolicy }}
          command:
            {{- toYaml .Values.mlflow.command | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.mlflow.service.port }}
              protocol: TCP
          env:
            - name: MLFLOW_SERVER_ENABLE_JOB_EXECUTION
              value: "false"
          resources:
            {{- toYaml .Values.mlflow.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data-storage
              mountPath: /app/data
            - name: mlruns-storage
              mountPath: /app/mlruns
            {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data-storage
          persistentVolumeClaim:
            claimName: {{ include "ticket-triage.fullname" . }}-data
        - name: mlruns-storage
          persistentVolumeClaim:
            claimName: {{ include "ticket-triage.fullname" . }}-mlruns
        {{- end }}
