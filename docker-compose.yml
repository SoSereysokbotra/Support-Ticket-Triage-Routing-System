services:
  # ---------------------------------------------------------------------------
  # Database & Caching Services (High-Concurrency Tier)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ticket-triage-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ticket_triage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticket_triage"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ticket-triage-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Application Services
  # ---------------------------------------------------------------------------
  # 1. FastAPI Real-Time Inference & Routing Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ticket-triage:latest
    container_name: ticket-triage-api
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/ticket_triage
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - FEAST_USAGE=True
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mlruns:/app/mlruns
    deploy:
      resources:
        limits:
          memory: 3g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 2. Streamlit MLOps Monitoring Dashboard
  dashboard:
    image: ticket-triage:latest
    container_name: ticket-triage-dashboard
    command: ["streamlit", "run", "src/presentation/dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - POSTGRES_DB_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/ticket_triage
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mlruns:/app/mlruns
    deploy:
      resources:
        limits:
          memory: 1500m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - api
      - postgres
    restart: unless-stopped

  # 3. MLflow Tracking & Model Registry Server
  mlflow:
    image: ticket-triage:latest
    container_name: ticket-triage-mlflow
    command: [
      "mlflow", "server",
      "--backend-store-uri", "postgresql+psycopg2://postgres:postgres@postgres:5432/mlflow",
      "--default-artifact-root", "/app/mlruns",
      "--host", "0.0.0.0",
      "--port", "5000",
      "--workers", "2"
    ]
    environment:
      - MLFLOW_SERVER_ENABLE_JOB_EXECUTION=false
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./mlruns:/app/mlruns
    deploy:
      resources:
        limits:
          memory: 1500m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 4. React Frontend (Vite build served by nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    image: ticket-triage-frontend:latest
    container_name: ticket-triage-frontend
    ports:
      - "5173:80"
    deploy:
      resources:
        limits:
          memory: 128m
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
